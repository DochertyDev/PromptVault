name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --test tests/*.test.mjs
      - run: npm test --if-present
      - name: Storage regressions when available
        run: |
          if [ -f tests/storage.test.cjs ]; then
            node --test tests/storage.test.cjs
          fi
      - run: npm run build
